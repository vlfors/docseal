name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # The browser app is a static site whose security policy lives in a <meta> tag.
      - name: The web build carries its Content Security Policy
        run: grep -q 'http-equiv="content-security-policy"' apps/web/build/index.html
      - run: pnpm test
      # The built MCP server over stdio, in both protocol eras.
      - run: pnpm test:mcp

  # The Node.js file handling on macOS: no /proc, so the MCP server checks an opened file by its
  # identity instead, and the file system may ignore case.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/node apps/mcp apps/cli

  # Coverage floor, and the packed tarballs installed with npm and run as a user would.
  coverage-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - run: scripts/smoke-test.sh

  # The core and the built site in Chromium, Firefox, and WebKit: every golden package gets its
  # required verdicts, in the core and on the verify page.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Packages sealed in the browser are also checked by the independent Python verifier.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m venv verifiers/python/.venv
      - run: verifiers/python/.venv/bin/pip install --require-hashes -r verifiers/python/requirements.txt
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - run: pnpm test:e2e

  python-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r verifiers/python/requirements.txt
      - run: python -I verifiers/python/docseal_verify.py vectors spec/vectors

  # The TypeScript and Python verifiers must agree on every mutated package. A new seed on
  # every run widens coverage over time; a failure prints the seed to reproduce it locally.
  differential-fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m venv verifiers/python/.venv
      - run: verifiers/python/.venv/bin/pip install --require-hashes -r verifiers/python/requirements.txt
      - run: pnpm vitest run tests/differential.test.ts tests/fuzz.test.ts
        env:
          FUZZ_RUNS: "2000"
          FUZZ_SEED: ${{ github.run_id }}
