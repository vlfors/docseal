name: Release

# Pushing a tag v<version> publishes that version. The tarballs are built once, attested
# (GitHub build provenance), published to npm with npm provenance, and attached to the
# GitHub release together with their SHA-256 sums. The web app is built once too: the same
# static site is attached to the release, attested, and then served by GitHub Pages.
#
# Everything that runs project or dependency code (install, checks, build, pack) happens in
# `build`, which holds no credentials. `publish` holds them and runs no project code: no
# checkout, no install; it only publishes the tarballs `build` handed over.
#
# Run by hand (Actions → Release → Run workflow), it is a rehearsal: `build` runs in full for
# the version in package.json, and `rehearse` checks the tarballs and runs `npm publish
# --dry-run` without any credentials. Nothing is published, attested, or released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Choose the tag and mode
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "CHECK_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(node -p 'require("./packages/core/package.json").version')" >> "$GITHUB_ENV"
            echo "CHECK_FLAGS=--dry-run" >> "$GITHUB_ENV"
          fi
      - run: node scripts/check-release.mjs "$TAG" $CHECK_FLAGS
      - run: pnpm check
      - run: pip install --require-hashes -r verifiers/python/requirements.txt
      - run: python -I verifiers/python/docseal_verify.py vectors spec/vectors
      - run: scripts/smoke-test.sh
      - run: scripts/pack.sh release
      # The site shows the commit it was built from; GitHub Pages serves it under /docseal.
      - name: Build the web app
        run: pnpm --filter @docseal/web build
        env:
          BASE_PATH: /docseal
          DOCSEAL_COMMIT: ${{ github.sha }}
      - run: tar -czf "release/docseal-web-${TAG#v}.tar.gz" -C apps/web/build .
      - run: node scripts/check-release.mjs "$TAG" --notes $CHECK_FLAGS > release/release-notes.md
      - run: cd release && sha256sum *.tgz *.tar.gz > SHA256SUMS && echo "$TAG" > tag
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/build

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance and trusted publishing, build attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - run: cd release && sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # In dependency order. Trusted publishing (OIDC) needs no token; NPM_TOKEN is the
      # fallback while it is not configured on npmjs.com. --ignore-scripts: a tarball's
      # lifecycle scripts must not run where the credentials are.
      - name: Publish to npm
        run: |
          for name in core sig-ed25519 anchor-ots cli; do
            npm publish "./release/docseal-$name-${GITHUB_REF_NAME#v}.tgz" --provenance --access public --ignore-scripts
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/*.tar.gz release/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "DocSeal $GITHUB_REF_NAME" --notes-file release/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # The same steps as `publish` where they can run without credentials: no environment, no
  # secrets, read-only permissions. npm checks each tarball and the registry, uploads nothing.
  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - run: cd release && sha256sum --check --strict SHA256SUMS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Publish to npm (dry run)
        run: |
          tag=$(cat release/tag)
          for name in core sig-ed25519 anchor-ots cli; do
            npm publish "./release/docseal-$name-${tag#v}.tgz" --access public --ignore-scripts --dry-run
          done
      - name: The GitHub release that would be created
        run: |
          echo "Title: DocSeal $(cat release/tag)"
          echo "Assets:"; ls -l release/*.tgz release/*.tar.gz release/SHA256SUMS
          echo "Notes:"; cat release/release-notes.md

  # Serves the site the build job made, once the release is published (after its approval).
  # It runs no project code: no checkout, no install; it only deploys the uploaded artifact.
  pages:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
